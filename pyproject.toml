[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-alignment"
version = "0.1.0"
description = "Stereo image pair analysis tool for computing roll and pitch alignment metrics"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "Nikhil Jaiyam"}]
keywords = ["stereo-vision", "alignment", "computer-vision"]

dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "scipy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
stereo-align = "stereo_alignment.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/stereo-alignment"
Repository = "https://github.com/yourusername/stereo-alignment"

[tool.setuptools]
packages = ["stereo_alignment"]

[tool.setuptools.package-data]
stereo_alignment = ["py.typed"]
