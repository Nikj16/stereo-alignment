[metadata]
name = stereo-alignment
version = 0.1.0
author = Nikhil Jaiyam
description = Stereo image pair analysis for roll and pitch metrics
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Nikj16/stereo-alignment
license = MIT
platforms = any

[options]
packages = find:
zip_safe = False
include_package_data = True
python_requires = >=3.7
install_requires =
    opencv-python>=4.5.0
    numpy>=1.19.0
    scipy>=1.5.0

[options.packages.find]
where = .
include = stereo_alignment*

[options.entry_points]
console_scripts =
    stereo-align = stereo_alignment.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    black>=22.0
    flake8>=4.0
    mypy>=0.950
